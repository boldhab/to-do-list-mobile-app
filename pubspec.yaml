name: task_planner
description: An offline task planner for daily, weekly, and monthly planning.
publish_to: none
version: 1.0.0+2

environment:
  sdk: ^3.13.4

dependencies:
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  fl_chart: ^1.3.1
  flutter:
    sdk: flutter
  flutter_local_notifications: ^23.0.3
  flutter_riverpod: ^2.6.1
  flutter_timezone: ^5.1.1
  go_router: ^14.8.1
  intl: ^0.20.2
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.3
  build_runner: ^2.17.1

flutter:
  uses-material-design: true
